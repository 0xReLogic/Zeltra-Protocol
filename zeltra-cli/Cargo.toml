[package]
name = "zeltra-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
zeltra-core = { path = "../zeltra-core" }
zeltra-sdk = { path = "../zeltra-sdk" }
clap = { version = "4.6.1", features = ["derive"] }
rand = "0.8.6"
tokio = { version = "1.52.3", features = ["full"] }
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27.0"


