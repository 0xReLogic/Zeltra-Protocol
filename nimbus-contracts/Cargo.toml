[package]
name = "nimbus_contracts"
version = "0.1.0"
edition = "2021"

[lib]
name = "nimbus_contracts"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nimbus_contracts"
path = "src/main.rs"

[dependencies]
stylus-sdk = "0.6.0"
alloy-primitives = "0.7.6"
alloy-sol-types = "0.7.6"
ark-bls12-381 = "0.4.0"
ark-ec = "0.4.0"
ark-ff = "0.4.0"
ark-serialize = "0.4.0"

[features]
export-abi = ["stylus-sdk/export-abi"]

[dev-dependencies]
rand = "0.8.5"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
