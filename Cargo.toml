[workspace]
members = [
    "zeltra-core",
    "zeltra-cli",
    "zeltra-contracts",
    "zeltra-sdk",
    "zeltra-node"
]
default-members = ["zeltra-contracts"]
resolver = "2"

[workspace.dependencies]
getrandom = "=0.2.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.test]
debug = 0
opt-level = 2


