[package]
name = "zeltra-core"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-bls12-381 = "0.6.0"
ark-ec = "0.6.0"
ark-ff = "0.6.0"
ark-std = "0.6.0"
ark-serialize = "0.6.0"
ark-groth16 = "0.6.0"
ark-relations = "0.6.0"
ark-poly = "0.6.0"
ark-r1cs-std = "0.6.0"
ark-snark = "0.6.0"
rand = "0.10.3"
sha2 = "0.10.9"
sha3 = "0.10.9"
digest = "0.10.7"
rayon = "1.12.0"
hex = "0.4.3"
hkdf = "0.12.4"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"] }
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"] }
bech32 = "0.11"


[dev-dependencies]
criterion = "0.5"
serde_json = "1.0.150"

[[bench]]
name = "mmr_root"
harness = false
