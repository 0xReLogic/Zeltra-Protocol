[package]
name = "nimbus-node"
version = "0.1.0"
edition = "2021"

[dependencies]
nimbus-core = { path = "../nimbus-core" }
axum = "0.7.5"
tokio = { version = "1.36.0", features = ["full"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.110"
hex = "0.4.3"
rand = "0.8.5"
base64 = "0.22.1"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
tempfile = "3.0"
