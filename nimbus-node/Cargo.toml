[package]
name = "nimbus-node"
version = "0.1.0"
edition = "2021"

[dependencies]
nimbus-core = { path = "../nimbus-core" }
axum = "0.8"
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
hex = "0.4.3"
rand = "0.8.5"
base64 = "0.22.1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
anyhow = "1.0"
alloy = { version = "1.8", features = ["node-bindings", "provider-ws", "signer-local"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.27"
