[package]
name = "nimbus-node"
version = "0.1.0"
edition = "2021"

[dependencies]
nimbus-core = { path = "../nimbus-core" }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
hex = "0.4.3"
rand = "0.8.6"
base64 = "0.22.1"
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher"] }
anyhow = "1.0.102"
alloy = { version = "2.0.5", features = ["node-bindings", "provider-ws", "signer-local"] }
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3.27.0"
