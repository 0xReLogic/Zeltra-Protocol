name: Nightly Maintenance

on:
  schedule:
    # Run every Sunday at 03:00 UTC 
    - cron: "0 3 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  maintenance:
    name: Upstream Health & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install security auditing tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,nextest

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "nightly-cache"

      - name: Audit vulnerabilities (cargo audit)
        run: cargo audit
        continue-on-error: true

      - name: Check license policies (cargo deny)
        run: cargo deny check
        continue-on-error: true

      - name: Run workspace tests
        run: cargo nextest run --workspace --all-targets

      - name: Build Stylus contract WASM
        run: cargo build -p zeltra_contracts --target wasm32-unknown-unknown --release

  semver:
    name: Semver Compatibility Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check semver for SDK & Core
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: zeltra-sdk
        continue-on-error: true

  miri:
    name: Miri Undefined Behavior Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nightly Rust toolchain with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "miri-cache"

      - name: Run Miri on accounting and memory safety tests
        run: cargo miri test -p zeltra-core --lib accounting
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-strict-provenance"
        continue-on-error: true
