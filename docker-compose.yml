version: '3'

services:
  vault:
    image: hashicorp/vault:latest
    container_name: zeltra-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: test-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK

  leader:
    image: zeltra-node:latest
    container_name: zeltra-leader
    ports:
      - "8080:8080"
    volumes:
      - ./test_leader.db:/app/test_leader.db
    environment:
      - PORT=8080
      - ZELTRA_BIND_ADDR=0.0.0.0
      - ZELTRA_ENV=test
      - ZELTRA_SHARE_INDEX=1
      - ZELTRA_VAULT_ADDR=http://vault:8200
      - ZELTRA_VAULT_TOKEN=test-root-token
      - ZELTRA_VAULT_PATH=v1/secret/data/zeltra/leader
      - ZELTRA_THRESHOLD=3
      - ZELTRA_DB_PATH=/app/test_leader.db
      - ZELTRA_ISSUER_PUBLIC_KEY=${ZELTRA_ISSUER_PUBLIC_KEY}
      - ZELTRA_GUARDIAN_PUBLIC_KEYS=${ZELTRA_GUARDIAN_PUBLIC_KEYS_1}
      - ZELTRA_RPC_URL=${ZELTRA_RPC_URL}
      - ZELTRA_RPC_FALLBACK_URL=${ZELTRA_RPC_FALLBACK_URL}
      - ZELTRA_RELAYER_PRIVATE_KEY=${ZELTRA_RELAYER_PRIVATE_KEY}
      - ZELTRA_CONTRACT_ADDRESS=${ZELTRA_CONTRACT_ADDRESS}
      - ZELTRA_BATCH_ENABLED=true
      - ZELTRA_ETH_PRICE_USDC=${ZELTRA_ETH_PRICE_USDC:-3500.0}
      - ZELTRA_CHAINLINK_ETH_FEED=${ZELTRA_CHAINLINK_ETH_FEED:-0xd30e2101a97dcbAeBCBC04F14C3f624E67A35165}
    depends_on:
      - vault

  guardian-1:
    image: zeltra-node:latest
    container_name: zeltra-guardian-1
    ports:
      - "8081:8081"
    volumes:
      - ./test_guardian_1.db:/app/test_guardian_1.db
    environment:
      - PORT=8081
      - ZELTRA_BIND_ADDR=0.0.0.0
      - ZELTRA_ENV=test
      - ZELTRA_SHARE_INDEX=2
      - ZELTRA_VAULT_ADDR=http://vault:8200
      - ZELTRA_VAULT_TOKEN=test-root-token
      - ZELTRA_VAULT_PATH=v1/secret/data/zeltra/guardian-1
      - ZELTRA_THRESHOLD=3
      - ZELTRA_DB_PATH=/app/test_guardian_1.db
      - ZELTRA_ISSUER_PUBLIC_KEY=${ZELTRA_ISSUER_PUBLIC_KEY}
      - ZELTRA_GUARDIAN_PUBLIC_KEYS=${ZELTRA_GUARDIAN_PUBLIC_KEYS_2}
      - ZELTRA_TRUSTED_LEADERS=${ZELTRA_TRUSTED_LEADERS}
    depends_on:
      - vault

  guardian-2:
    image: zeltra-node:latest
    container_name: zeltra-guardian-2
    ports:
      - "8082:8082"
    volumes:
      - ./test_guardian_2.db:/app/test_guardian_2.db
    environment:
      - PORT=8082
      - ZELTRA_BIND_ADDR=0.0.0.0
      - ZELTRA_ENV=test
      - ZELTRA_SHARE_INDEX=3
      - ZELTRA_VAULT_ADDR=http://vault:8200
      - ZELTRA_VAULT_TOKEN=test-root-token
      - ZELTRA_VAULT_PATH=v1/secret/data/zeltra/guardian-2
      - ZELTRA_THRESHOLD=3
      - ZELTRA_DB_PATH=/app/test_guardian_2.db
      - ZELTRA_ISSUER_PUBLIC_KEY=${ZELTRA_ISSUER_PUBLIC_KEY}
      - ZELTRA_GUARDIAN_PUBLIC_KEYS=${ZELTRA_GUARDIAN_PUBLIC_KEYS_3}
      - ZELTRA_TRUSTED_LEADERS=${ZELTRA_TRUSTED_LEADERS}
    depends_on:
      - vault

  guardian-3:
    image: zeltra-node:latest
    container_name: zeltra-guardian-3
    ports:
      - "8083:8083"
    volumes:
      - ./test_guardian_3.db:/app/test_guardian_3.db
    environment:
      - PORT=8083
      - ZELTRA_BIND_ADDR=0.0.0.0
      - ZELTRA_ENV=test
      - ZELTRA_SHARE_INDEX=4
      - ZELTRA_VAULT_ADDR=http://vault:8200
      - ZELTRA_VAULT_TOKEN=test-root-token
      - ZELTRA_VAULT_PATH=v1/secret/data/zeltra/guardian-3
      - ZELTRA_THRESHOLD=3
      - ZELTRA_DB_PATH=/app/test_guardian_3.db
      - ZELTRA_ISSUER_PUBLIC_KEY=${ZELTRA_ISSUER_PUBLIC_KEY}
      - ZELTRA_GUARDIAN_PUBLIC_KEYS=${ZELTRA_GUARDIAN_PUBLIC_KEYS_4}
      - ZELTRA_TRUSTED_LEADERS=${ZELTRA_TRUSTED_LEADERS}
    depends_on:
      - vault

  guardian-4:
    image: zeltra-node:latest
    container_name: zeltra-guardian-4
    ports:
      - "8084:8084"
    volumes:
      - ./test_guardian_4.db:/app/test_guardian_4.db
    environment:
      - PORT=8084
      - ZELTRA_BIND_ADDR=0.0.0.0
      - ZELTRA_ENV=test
      - ZELTRA_SHARE_INDEX=5
      - ZELTRA_VAULT_ADDR=http://vault:8200
      - ZELTRA_VAULT_TOKEN=test-root-token
      - ZELTRA_VAULT_PATH=v1/secret/data/zeltra/guardian-4
      - ZELTRA_THRESHOLD=3
      - ZELTRA_DB_PATH=/app/test_guardian_4.db
      - ZELTRA_ISSUER_PUBLIC_KEY=${ZELTRA_ISSUER_PUBLIC_KEY}
      - ZELTRA_GUARDIAN_PUBLIC_KEYS=${ZELTRA_GUARDIAN_PUBLIC_KEYS_5}
      - ZELTRA_TRUSTED_LEADERS=${ZELTRA_TRUSTED_LEADERS}
    depends_on:
      - vault
