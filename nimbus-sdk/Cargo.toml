[package]
name = "nimbus-sdk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nimbus-core = { path = "../nimbus-core" }
wasm-bindgen = "0.2.122"
hex = "0.4.3"
rand = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
base64 = "0.22.1"
sha2 = "0.10.9"
sha3 = "0.10.9"
ark-ec = "0.6.0"
ark-ff = "0.6.0"
ark-groth16 = "0.6.0"
ark-bls12-381 = "0.6.0"
