[package]
name = "nimbus-sdk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nimbus-core = { path = "../nimbus-core" }
wasm-bindgen = "0.2.92"
hex = "0.4.3"
rand = { version = "0.8.5", features = ["getrandom"] }
getrandom = { version = "0.2.10", features = ["js"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.110"
base64 = "0.22.1"
sha2 = "0.10.8"
sha3 = "0.10.8"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-groth16 = "0.5.0"
ark-bls12-381 = "0.5.0"
