[package]
name = "nimbus-sdk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alloy-primitives = "1.0"
alloy-sol-types = { version = "1.0", features = ["eip712-serde"] }
ark-bls12-381 = "0.6.0"
ark-ec = "0.6.0"
ark-ff = "0.6.0"
ark-groth16 = "0.6.0"
base64 = "0.22.1"
hex = "0.4.3"
js-sys = "0.3"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
nimbus-core = { path = "../nimbus-core" }
rand = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
sha3 = "0.10.9"
wasm-bindgen = "0.2.122"
